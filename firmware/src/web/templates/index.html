<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Monitor - Live View</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .monitor-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .video-container {
            position: relative;
            background: #000;
            aspect-ratio: 16 / 9;
        }

        #videoFeed {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2em;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #28a745;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .status-text {
            font-size: 0.9em;
            color: #495057;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px 30px;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 0.85em;
            color: #6c757d;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.3em;
            font-weight: 600;
            color: #212529;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .info-grid {
                grid-template-columns: 1fr 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>👶 Baby Monitor</h1>
            <p class="subtitle">Live View - Phase 1 Prototype</p>
        </header>

        <div class="monitor-card">
            <div class="video-container">
                <img id="videoFeed" src="/video_feed" alt="Live Video Feed">
                <div class="loading" id="loading">Loading camera...</div>
            </div>

            <div class="status-bar">
                <div class="status-item">
                    <div class="status-indicator"></div>
                    <span class="status-text">Camera Online</span>
                </div>
                <div class="status-item">
                    <span class="status-text" id="timestamp">--:--:--</span>
                </div>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Resolution</div>
                    <div class="info-value" id="resolution">1280x720</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Frame Rate</div>
                    <div class="info-value" id="framerate">30 fps</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Status</div>
                    <div class="info-value" id="status">Streaming</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="captureSnapshot()">📸 Capture Snapshot</button>
                <button class="btn btn-secondary" onclick="refreshStream()">🔄 Refresh Stream</button>
            </div>
        </div>

        <footer>
            <p>Baby Monitor Prototype v0.1 - Phase 1: Camera + Basic Streaming</p>
        </footer>
    </div>

    <script>
        // Update timestamp
        function updateTimestamp() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            document.getElementById('timestamp').textContent = timeString;
        }

        setInterval(updateTimestamp, 1000);
        updateTimestamp();

        // Fetch camera status
        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                document.getElementById('resolution').textContent =
                    `${data.resolution.width}x${data.resolution.height}`;
                document.getElementById('framerate').textContent =
                    `${data.framerate} fps`;
                document.getElementById('status').textContent =
                    data.recording ? 'Recording' : 'Streaming';

            } catch (error) {
                console.error('Error fetching status:', error);
            }
        }

        // Fetch status every 5 seconds
        setInterval(fetchStatus, 5000);
        fetchStatus();

        // Hide loading message when video loads
        const video = document.getElementById('videoFeed');
        video.onload = function() {
            document.getElementById('loading').style.display = 'none';
        };

        // Capture snapshot
        function captureSnapshot() {
            window.open('/api/snapshot', '_blank');
        }

        // Refresh stream
        function refreshStream() {
            const video = document.getElementById('videoFeed');
            const src = video.src;
            video.src = '';
            setTimeout(() => {
                video.src = src + '?t=' + new Date().getTime();
            }, 100);
        }

        // Show loading message
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
        }, 3000);
    </script>
</body>
</html>
