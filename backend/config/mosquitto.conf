# Mosquitto Configuration for Baby Monitor

# Listeners
listener 1883
protocol mqtt

listener 9001
protocol websockets

# Security (development - no auth)
# Production should enable authentication
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection settings
max_connections 1000
max_keepalive 300

# Message size
message_size_limit 10485760

# Queue settings
max_queued_messages 1000
