name: baby_monitor_dashboard
description: Baby Monitor Web Dashboard - Flutter Application
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Networking
  dio: ^5.4.0
  socket_io_client: ^2.0.3
  retrofit: ^4.0.3
  json_annotation: ^4.8.1

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3

  # UI Components
  fl_chart: ^0.66.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.9

  # Video
  video_player: ^2.8.1
  chewie: ^1.7.4

  # Utilities
  intl: ^0.18.1
  timeago: ^3.6.0
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.2.2
  path_provider: ^2.1.1
  file_picker: ^6.1.1
  csv: ^6.0.0

  # Icons
  cupertino_icons: ^1.0.6
  lucide_icons: ^0.263.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  retrofit_generator: ^8.0.4
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
